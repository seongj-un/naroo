services:
  postgres:
    image: postgres:17-alpine
    container_name: naroo-postgres
    environment:
      POSTGRES_DB: ${NAROO_DATABASE_NAME:-naroo}
      POSTGRES_USER: ${NAROO_DATABASE_USERNAME:-naroo}
      POSTGRES_PASSWORD: ${NAROO_DATABASE_PASSWORD:-naroo}
    ports:
      - "${NAROO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - naroo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: naroo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${NAROO_REDIS_PORT:-6379}:6379"
    volumes:
      - naroo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  naroo-postgres-data:
  naroo-redis-data:
