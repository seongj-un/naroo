services:
  mysql:
    image: mysql:8.0
    container_name: naroo-mysql
    environment:
      MYSQL_DATABASE: ${NAROO_DATABASE_NAME:-naroo}
      MYSQL_USER: ${NAROO_DATABASE_USERNAME:-naroo}
      MYSQL_PASSWORD: ${NAROO_DATABASE_PASSWORD:-naroo}
      MYSQL_ROOT_PASSWORD: ${NAROO_DATABASE_ROOT_PASSWORD:-naroo-root}
    ports:
      - "${NAROO_MYSQL_PORT:-3307}:3306"
    volumes:
      - naroo-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" -e \"select 1\" \"$${MYSQL_DATABASE}\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: naroo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${NAROO_REDIS_PORT:-6379}:6379"
    volumes:
      - naroo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  naroo-mysql-data:
  naroo-redis-data:
