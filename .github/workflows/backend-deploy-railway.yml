name: Backend Deploy Railway

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    permissions:
      contents: read

    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_NAME: ${{ vars.RAILWAY_ENVIRONMENT_NAME }}
      RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Validate Railway deploy inputs
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "Missing GitHub secret: RAILWAY_API_TOKEN" >&2
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "Missing GitHub variable: RAILWAY_PROJECT_ID" >&2
            exit 1
          fi
          if [ -z "$RAILWAY_ENVIRONMENT_NAME" ]; then
            echo "Missing GitHub variable: RAILWAY_ENVIRONMENT_NAME" >&2
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE_NAME" ]; then
            echo "Missing GitHub variable: RAILWAY_SERVICE_NAME" >&2
            exit 1
          fi

      - name: Deploy backend
        run: |
          railway up \
            --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_NAME" \
            --service "$RAILWAY_SERVICE_NAME"
