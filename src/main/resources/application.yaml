server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: naroo
  datasource:
    url: ${MYSQL_URL:${NAROO_DATABASE_URL:jdbc:mysql://${MYSQLHOST:${NAROO_DATABASE_HOST:localhost}}:${MYSQLPORT:${NAROO_DATABASE_PORT:3306}}/${MYSQLDATABASE:${NAROO_DATABASE_NAME:naroo}}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=${MYSQL_SSL_ENABLED:${NAROO_DATABASE_SSL_ENABLED:false}}}}
    username: ${MYSQL_USER:${NAROO_DATABASE_USERNAME:${MYSQLUSER:naroo}}}
    password: ${MYSQL_PASS:${NAROO_DATABASE_PASSWORD:${MYSQLPASSWORD:naroo}}}
  data:
    redis:
      host: ${NAROO_REDIS_HOST:${REDISHOST:localhost}}
      port: ${NAROO_REDIS_PORT:${REDISPORT:6379}}
      username: ${NAROO_REDIS_USERNAME:${REDISUSER:}}
      password: ${NAROO_REDIS_PASSWORD:${REDISPASSWORD:}}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

naroo:
  auth:
    email-verification-token-ttl-minutes: ${NAROO_AUTH_EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:30}
    email:
      mode: ${NAROO_AUTH_EMAIL_MODE:log}
      from-address: ${NAROO_AUTH_EMAIL_FROM_ADDRESS:no-reply@naroo.app}
      from-name: ${NAROO_AUTH_EMAIL_FROM_NAME:Naroo}
      verification-url-template: ${NAROO_AUTH_EMAIL_VERIFICATION_URL_TEMPLATE:http://localhost:3000/verify-email?token={token}}
    refresh-cookie-secure: ${NAROO_AUTH_REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${NAROO_AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${NAROO_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${NAROO_JWT_SECRET}
    access-token-ttl-minutes: ${NAROO_JWT_ACCESS_TOKEN_TTL_MINUTES:60}
    refresh-token-ttl-days: ${NAROO_JWT_REFRESH_TOKEN_TTL_DAYS:3}
  seed:
    student:
      enabled: ${NAROO_SEED_STUDENT_ENABLED:false}
      login-id: ${NAROO_SEED_STUDENT_LOGIN_ID:student01}
      email: ${NAROO_SEED_STUDENT_EMAIL:student01@example.com}
      password: ${NAROO_SEED_STUDENT_PASSWORD:password123}
      nickname: ${NAROO_SEED_STUDENT_NICKNAME:나루}
      math-status: ${NAROO_SEED_STUDENT_MATH_STATUS:UNKNOWN}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
