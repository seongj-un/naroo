spring:
  application:
    name: naroo
  datasource:
    url: ${NAROO_DATABASE_URL:jdbc:mysql://127.0.0.1:3307/naroo?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${NAROO_DATABASE_USERNAME:naroo}
    password: ${NAROO_DATABASE_PASSWORD:naroo}
  data:
    redis:
      host: ${NAROO_REDIS_HOST:localhost}
      port: ${NAROO_REDIS_PORT:6379}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

naroo:
  auth:
    email-verification-token-ttl-minutes: ${NAROO_AUTH_EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:30}
  jwt:
    secret: ${NAROO_JWT_SECRET:naroo-local-development-secret-32bytes}
    access-token-ttl-minutes: ${NAROO_JWT_ACCESS_TOKEN_TTL_MINUTES:60}
    refresh-token-ttl-days: ${NAROO_JWT_REFRESH_TOKEN_TTL_DAYS:3}
