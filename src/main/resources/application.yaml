spring:
  application:
    name: naroo
  datasource:
    url: ${MYSQL_URL:${NAROO_DATABASE_URL:jdbc:mysql://localhost:3306/naroo?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}}
    username: ${MYSQL_USER:${NAROO_DATABASE_USERNAME:naroo}}
    password: ${MYSQL_PASS:${NAROO_DATABASE_PASSWORD:naroo}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${NAROO_REDIS_HOST:localhost}
      port: ${NAROO_REDIS_PORT:6379}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

naroo:
  auth:
    email-verification-token-ttl-minutes: ${NAROO_AUTH_EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:30}
    refresh-cookie-secure: ${NAROO_AUTH_REFRESH_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${NAROO_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${NAROO_JWT_SECRET:naroo-local-development-secret-32bytes}
    access-token-ttl-minutes: ${NAROO_JWT_ACCESS_TOKEN_TTL_MINUTES:60}
    refresh-token-ttl-days: ${NAROO_JWT_REFRESH_TOKEN_TTL_DAYS:3}
